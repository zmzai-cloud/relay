# Relay 自托管（开源化批次 2）：docker compose up -d
#   1) cp .env.example .env 并填写 AUTH_SECRET / 品牌
#   2) docker compose up -d && 打开 http://localhost:3000/setup
# Mongo 以单节点副本集运行——余额核销与 onboarding 发布走事务，需要 replSet。
services:
  mongo:
    image: mongo:8
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { quit(db.getSiblingDB(\"admin\").hello().isWritablePrimary ? 0 : 1) } catch (e) { quit(1) }'"]
      interval: 5s
      timeout: 4s
      retries: 24
      start_period: 10s
    restart: unless-stopped

  mongo-init:
    image: mongo:8
    depends_on:
      mongo:
        condition: service_started
    # 注意：块标量（>）不处理反斜杠转义，\" 会原样传给 mongosh 造成 JS 语法错误
    # （首个 CI 实测翻车点）。改用 flow 风格数组：\" 才是真转义。
    entrypoint: ["bash", "-c", "for i in $$(seq 1 30); do mongosh 'mongodb://mongo:27017/?directConnection=true' --quiet --eval \"try { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}); quit(0) } catch (e) { quit(1) }\" && exit 0; sleep 2; done; exit 1"]
    restart: "no"

  app:
    # 默认本地构建；GHCR 镜像包设为 public 后可解注释直接拉取
    # image: ghcr.io/zmzai-cloud/relay:latest
    build:
      context: .
      args:
        # 部署档案按需覆盖（zmzai：https://relay.zmzai.cloud / https://auth.zmzai.cloud）
        NEXT_PUBLIC_API_ORIGIN: ${NEXT_PUBLIC_API_ORIGIN:-}
        NEXT_PUBLIC_AUTH_URL: ${NEXT_PUBLIC_AUTH_URL:-}
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/relay?replicaSet=rs0
      # 自托管形态默认关 zmzai 内部端点（zmzai 参考部署设 true）
      ENABLE_ZMZAI_INTERNAL: ${ENABLE_ZMZAI_INTERNAL:-false}
    ports:
      - "${RELAY_PORT:-3000}:3000"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo-data:
