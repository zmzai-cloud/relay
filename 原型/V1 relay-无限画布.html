<!DOCTYPE html>
<html lang="zh-CN" data-zcode-design>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relay 中转驿 · 无限画布</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #111110;
    --bg-subtle: #191918;
    --surface: #1e1e1d;
    --surface-raised: #252524;
    --border: rgba(255,255,255,0.06);
    --border-hover: rgba(255,255,255,0.12);
    --accent: #c89b6c;
    --accent-dim: rgba(200,155,108,0.15);
    --text: #e8e6e3;
    --text-secondary: rgba(232,230,227,0.6);
    --text-tertiary: rgba(232,230,227,0.32);
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.35), 0 2px 6px rgba(0,0,0,0.25);
    --shadow-lg: 0 12px 40px rgba(0,0,0,0.45), 0 4px 12px rgba(0,0,0,0.3);
    --shadow-drag: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1.5px var(--accent);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --radius-xl: 20px;
    --font-sans: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --font-mono: "SF Mono", "Fira Code", "JetBrains Mono", "Cascadia Code", monospace;
    --note-bg: #2a2520;
    --note-border: rgba(200,155,108,0.2);
    --transition-fast: 120ms cubic-bezier(0.25, 0.1, 0.25, 1);
    --transition-normal: 200ms cubic-bezier(0.25, 0.1, 0.25, 1);
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: var(--font-sans);
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* grain overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 9999;
    pointer-events: none;
    opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 512px 512px;
    mix-blend-mode: overlay;
  }

  /* ===== canvas viewport ===== */
  .canvas-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    cursor: grab;
  }
  .canvas-viewport.panning { cursor: grabbing; }

  #relay-css{} .canvas-world {
    position: absolute;
    left: 0; top: 0;
    width: 20000px; height: 20000px;
    transform-origin: 0 0;
    will-change: transform;
  }

  /* ===== dot grid ===== */
  .canvas-viewport {
    --grid-color: rgba(255,255,255,0.04);
  }

  /* ===== draggable elements ===== */
  .canvas-el {
    position: absolute;
    cursor: grab;
    transition: box-shadow var(--transition-normal), transform var(--transition-fast);
  }
  .canvas-el:hover { z-index: 10; }
  .canvas-el.dragging {
    cursor: grabbing;
    z-index: 999;
    box-shadow: var(--shadow-drag) !important;
    transform: scale(1.01);
    transition: none;
  }

  /* ===== section header ===== */
  .section-header {
    position: absolute;
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 16px;
    white-space: nowrap;
  }
  .section-header .section-num {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    color: var(--accent);
    opacity: 0.8;
  }
  .section-header .section-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-tertiary);
  }
  .section-header .section-line {
    flex: none;
    width: 48px;
    height: 1px;
    background: linear-gradient(90deg, var(--accent) 0%, transparent 100%);
    opacity: 0.3;
  }

  /* ===== title ===== */
  .canvas-title {
    position: absolute;
    pointer-events: none;
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.025em;
    color: var(--text);
  }

  /* ===== text block ===== */
  .canvas-text {
    position: absolute;
    line-height: 1.7;
    letter-spacing: 0.005em;
    color: var(--text-secondary);
    min-width: 200px;
    max-width: 560px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* ===== tag ===== */
  .canvas-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 14px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--text-secondary);
    background: var(--surface);
    border: 1px solid var(--border);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: border-color var(--transition-fast), background var(--transition-fast);
    white-space: nowrap;
  }
  .canvas-tag:hover {
    border-color: var(--border-hover);
    background: var(--surface-raised);
  }
  .canvas-tag .tag-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }

  /* ===== context card ===== */
  .context-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
    min-width: 220px;
    transition: border-color var(--transition-normal), box-shadow var(--transition-normal);
  }
  .context-card:hover {
    border-color: var(--border-hover);
    box-shadow: var(--shadow-md);
  }
  .context-card .card-head {
    padding: 16px 20px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .context-card .card-head .head-indicator {
    width: 3px;
    height: 16px;
    border-radius: 2px;
    background: var(--accent);
    flex-shrink: 0;
  }
  .context-card .card-head h3 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--text);
  }
  .context-card .card-content {
    padding: 0 20px 20px;
    font-size: 13px;
    line-height: 1.7;
    color: var(--text-secondary);
  }
  .context-card .card-content ul {
    list-style: none;
    padding: 0;
  }
  .context-card .card-content li {
    padding: 4px 0;
    padding-left: 12px;
    position: relative;
  }
  .context-card .card-content li::before {
    content: '';
    position: absolute;
    left: 0;
    top: 11px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--text-tertiary);
  }

  /* ===== design system card ===== */
  .ds-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
    transition: border-color var(--transition-normal), box-shadow var(--transition-normal);
  }
  .ds-card:hover {
    border-color: var(--border-hover);
    box-shadow: var(--shadow-md);
  }
  .ds-card .ds-head {
    padding: 16px 20px 12px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-tertiary);
  }
  .ds-card .ds-body {
    padding: 0 20px 20px;
  }

  /* color type */
  .ds-card .color-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(48px, 1fr));
    gap: 8px;
  }
  .ds-card .color-chip {
    aspect-ratio: 1;
    border-radius: var(--radius-sm);
    position: relative;
    transition: transform var(--transition-fast);
  }
  .ds-card .color-chip:hover { transform: scale(1.08); }
  .ds-card .color-chip .chip-label {
    position: absolute;
    bottom: -18px;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text-tertiary);
    white-space: nowrap;
  }

  /* typography type */
  .ds-card .type-stack {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .ds-card .type-row {
    display: flex;
    align-items: baseline;
    gap: 16px;
  }
  .ds-card .type-label {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text-tertiary);
    min-width: 36px;
    flex-shrink: 0;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .ds-card .type-sample {
    color: var(--text);
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ===== color swatch (standalone) ===== */
  .color-swatch-group {
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    gap: 20px;
  }
  .swatch-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .swatch-circle {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,0.08);
    transition: transform var(--transition-fast), box-shadow var(--transition-fast);
  }
  .swatch-circle:hover {
    transform: scale(1.1);
    box-shadow: var(--shadow-md);
  }
  .swatch-name {
    font-size: 10px;
    font-weight: 500;
    color: var(--text-secondary);
    text-align: center;
  }
  .swatch-hex {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text-tertiary);
    text-align: center;
  }

  /* ===== type sample (standalone) ===== */
  .type-sample-group {
    display: flex;
    flex-direction: column;
    gap: 20px;
    min-width: 400px;
  }
  .type-sample-row {
    display: flex;
    align-items: baseline;
    gap: 20px;
  }
  .type-sample-meta {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text-tertiary);
    min-width: 48px;
    flex-shrink: 0;
    letter-spacing: 0.04em;
  }
  .type-sample-text {
    color: var(--text);
    line-height: 1.25;
  }

  /* ===== note (sticky) ===== */
  .canvas-note {
    background: var(--note-bg);
    border: 1px solid var(--note-border);
    border-radius: var(--radius-md);
    padding: 16px 18px;
    min-width: 200px;
    max-width: 300px;
    box-shadow: var(--shadow-sm);
    transition: box-shadow var(--transition-normal), transform var(--transition-fast);
  }
  .canvas-note:hover {
    box-shadow: var(--shadow-md);
  }
  .canvas-note .note-tag {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    opacity: 0.7;
    margin-bottom: 8px;
  }
  .canvas-note .note-body {
    font-size: 13px;
    line-height: 1.65;
    color: var(--text-secondary);
  }

  /* ===== design page ===== */
  .design-page {
    background: #fff;
    border-radius: var(--radius-md);
    overflow: hidden;
    box-shadow: var(--shadow-lg);
    transition: box-shadow var(--transition-normal);
  }
  .design-page:hover {
    box-shadow: 0 16px 56px rgba(0,0,0,0.5), 0 6px 16px rgba(0,0,0,0.35);
  }
  .design-page .page-content {
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  .page-label {
    position: absolute;
    bottom: -32px;
    left: 0;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--text-tertiary);
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .page-label .label-num {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--accent);
    opacity: 0.6;
  }

  /* ===== diagram ===== */
  .canvas-diagram {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  .canvas-diagram .diagram-content {
    width: 100%;
    height: 100%;
    padding: 20px;
  }

  /* ===== zoom controls ===== */
  .zoom-controls {
    position: fixed;
    bottom: 24px; right: 24px;
    display: flex;
    align-items: center;
    gap: 1px;
    z-index: 100;
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    overflow: hidden;
    box-shadow: var(--shadow-md);
  }
  .zoom-btn {
    width: 36px; height: 36px;
    background: transparent;
    border: none;
    color: var(--text-secondary);
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background var(--transition-fast), color var(--transition-fast);
  }
  .zoom-btn:hover {
    background: rgba(255,255,255,0.06);
    color: var(--text);
  }
  .zoom-btn:active {
    background: rgba(255,255,255,0.03);
  }
  .zoom-label {
    min-width: 50px; height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-tertiary);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }

  /* ===== coord indicator ===== */
  .coord-indicator {
    position: fixed;
    bottom: 28px; left: 24px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.04em;
    color: var(--text-tertiary);
    z-index: 100;
    padding: 4px 10px;
    background: rgba(17,17,16,0.85);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  /* ===== keyboard hint ===== */
  .kbd-hint {
    position: fixed;
    top: 20px; right: 24px;
    z-index: 100;
    font-size: 10px;
    color: var(--text-tertiary);
    display: flex;
    gap: 12px;
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
  }
  .canvas-viewport:hover ~ .kbd-hint { opacity: 1; }
  .kbd-hint kbd {
    font-family: var(--font-mono);
    padding: 2px 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 10px;
  }
/* ══ relay 页面样式（scoped .rp）══ */
.rp { width: 100%; height: 100%; overflow: hidden; display: flex; flex-direction: column; }

/*
   Relay 中转驿 重设计 — 「工程台账」方向
   tokens 全部取自 @zmzai/theme v0.9（纯白 + 墨黑结构 + 品红点睛）
   纪律：spot 品红只出现在深色载体上；spot-strong 每屏最多一次；
   语义色只讲好坏；1px 硬规则线（rule）做区块骨架。
   ════════════════════════════════════════════════════════════════ */
.rp {
  /* 结构色 */
  --bg:           oklch(1 0 0);
  --surface:      oklch(0.985 0.001 265);
  --surface-2:    oklch(0.968 0.002 265);
  --surface-3:    oklch(0.94 0.003 265);
  --ink:          oklch(0.21 0.008 265);
  --ink-2:        oklch(0.442 0.017 265);
  --ink-3:        oklch(0.617 0.014 265);
  --line:         oklch(0.92 0.004 265);
  --line-strong:  oklch(0.87 0.005 265);
  --rule:         oklch(0.21 0.008 265);
  --accent:       oklch(0.21 0.008 265);
  --accent-ink:   oklch(1 0 0);
  --accent-strong:oklch(0.09 0.004 265);
  /* 语义色 */
  --success:      oklch(0.499 0.13 145);
  --success-tint: oklch(0.955 0.035 145);
  --live:         oklch(0.499 0.17 145);
  --live-tint:    oklch(0.955 0.045 145);
  --warning:      oklch(0.499 0.12 75);
  --warning-tint: oklch(0.955 0.045 90);
  --danger:       oklch(0.499 0.18 25);
  --danger-tint:  oklch(0.955 0.03 25);
  /* 品红点睛 — 仅深色载体 */
  --spot-strong:  oklch(0.659 0.275 350);
  --spot:         oklch(0.7 0.26 350);
  --spot-soft:    oklch(0.78 0.15 350);
  --spot-deep:    oklch(0.56 0.2 350);
  /* 深色载体 — 终端面板 */
  --dark-bg:      oklch(0.17 0.006 265);
  --dark-surface: oklch(0.23 0.007 265);
  --dark-ink:     oklch(0.97 0.002 265);
  --dark-line:    oklch(0.32 0.008 265);
  --dark-muted:   oklch(0.72 0.005 265);
  /* 阴影 / 圆角 / 动效 */
  --shadow-md: 0 4px 12px -2px oklch(0.21 0.008 265 / .08), 0 2px 4px -2px oklch(0.21 0.008 265 / .05);
  --shadow-lg: 0 12px 32px -8px oklch(0.21 0.008 265 / .12), 0 4px 8px -4px oklch(0.21 0.008 265 / .06);
  --r-xs: 2px; --r-sm: 3px; --r: 4px; --r-lg: 6px; --r-xl: 8px; --r-pill: 9999px;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  /* 字体 — 与 @zmzai/theme 完全同链；原型不外联字体 */
  --font-sans: "MiSans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
.rp {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-sans); font-size: 15px; line-height: 1.6;
  text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased;
}
.rp a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input, select { font: inherit; }
.rp ul, ol { margin: 0; padding: 0; list-style: none; }
.rp h1, h2, h3, p { margin: 0; }
svg { display: block; }

.rp :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }


/* ── 排版基线 ─────────────────────────────────────────────── */
.display {
  font-size: clamp(34px, 4.4vw, 46px); line-height: 1.12; letter-spacing: -0.02em; font-weight: 600;
}
.h1 { font-size: 28px; line-height: 1.2; letter-spacing: -0.01em; font-weight: 600; }
.h2 { font-size: 20px; line-height: 1.3; letter-spacing: -0.005em; font-weight: 600; }
.h3 { font-size: 16px; line-height: 1.4; font-weight: 600; }
.small { font-size: 13px; line-height: 1.55; }
.caption { font-size: 12px; line-height: 1.5; letter-spacing: 0.01em; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.eyebrow {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--ink-2);
}
.t-muted { color: var(--ink-2); }
.t-aux { color: var(--ink-3); }
code.inline {
  font-family: var(--font-mono); font-size: 12px;
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: var(--r-xs); padding: 1px 5px; white-space: nowrap;
}

/* ── 布局壳 ───────────────────────────────────────────────── */
#app { min-height: 100dvh; display: flex; flex-direction: column; }
.shell { display: flex; flex: 1; min-height: 0; }
#app[data-mode="console"] .topnav, #app[data-mode="console"] #sitefoot { display: none; }
#app[data-mode="public"] .sidebar { display: none; }

/* 公开区顶栏 */
.topnav {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 28px;
  height: 60px; padding: 0 28px;
  background: oklch(1 0 0 / .92); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.topnav .brand { display: flex; align-items: center; gap: 10px; margin-right: 8px; }
.topnav .brand .name { font-weight: 600; letter-spacing: -0.01em; }
.topnav .brand .name .sub { color: var(--ink-2); font-weight: 400; font-size: 12px; margin-left: 6px; }
.topnav nav { display: flex; gap: 4px; }
.topnav nav a {
  display: inline-flex; align-items: center; gap: 6px;
  height: 34px; padding: 0 12px; border-radius: var(--r-sm);
  font-size: 14px; color: var(--ink-2); transition: color .15s var(--ease-out), background .15s var(--ease-out);
}
.topnav nav a:hover { color: var(--ink); background: var(--surface); }
.topnav nav a[aria-current="page"] { color: var(--ink); background: var(--surface-2); }
.topnav .spacer { flex: 1; }
.topnav .meta { display: flex; align-items: center; gap: 14px; }

/* 控制台侧栏 */
.sidebar {
  width: 236px; flex-shrink: 0; position: sticky; top: 0; height: 100dvh;
  display: flex; flex-direction: column;
  border-right: 1px solid var(--line); background: var(--bg);
}
.sidebar .brand { display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 24px; border-bottom: 1px solid var(--line); }
.sidebar .brand .name { font-weight: 600; }
.sidebar nav { padding: 14px 12px 14px 24px; flex: 1; overflow-y: auto; }
.navgroup { margin-bottom: 18px; }
.navgroup > .eyebrow { display: block; padding: 0 10px; margin-bottom: 6px; }
.navitem {
  display: flex; align-items: center; gap: 10px; width: 100%;
  height: 34px; padding: 0 10px; border-radius: var(--r-sm);
  font-size: 14px; color: var(--ink-2); text-align: left;
  transition: color .15s var(--ease-out), background .15s var(--ease-out);
}
.navitem:hover { color: var(--ink); background: var(--surface); }
.navitem[aria-current="page"] { color: var(--ink); background: var(--surface-2); font-weight: 500; }
.navitem svg { flex-shrink: 0; opacity: .75; }
.navitem[aria-current="page"] svg { opacity: 1; }
.sidebar .account {
  border-top: 1px solid var(--line); padding: 14px 16px;
  display: flex; align-items: center; gap: 10px;
}
.sidebar .account .who { flex: 1; min-width: 0; }
.sidebar .account .who .nm { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sidebar .account .who .bal { font-size: 12px; color: var(--ink-2); margin-top: 1px; }
.sidebar .account .who .bal .num { color: var(--ink); }
.avatar {
  width: 30px; height: 30px; border-radius: var(--r-pill); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--ink); color: var(--accent-ink);
  font-size: 12px; font-weight: 600; letter-spacing: 0;
}

/* 主区 */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.content { width: min(100% - 56px, 1120px); margin-inline: auto; padding: 34px 0 80px; }
.content.wide { width: min(100% - 56px, 1320px); }

/* 页头（台账式：标题 + 硬规则线 + 页头行右侧动作） */
.pagehead { border-bottom: 1px solid var(--rule); padding-bottom: 18px; margin-bottom: 26px; }
.pagehead .row { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px 20px; flex-wrap: wrap; }
.pagehead .desc { margin-top: 8px; max-width: 62ch; color: var(--ink-2); font-size: 14px; }
.pagehead .actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

/* ── 组件 ─────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: 36px; padding: 0 16px; border-radius: var(--r-sm);
  font-size: 14px; font-weight: 500; letter-spacing: 0.02em;
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
  transition: background .15s var(--ease-out), transform .1s var(--ease-out);
}
.btn:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: default; pointer-events: none; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-strong); }
.btn.ghost:hover { background: var(--surface); border-color: var(--ink-3); }
.btn.sm { height: 30px; padding: 0 12px; font-size: 13px; }
.btn.danger-ghost { background: transparent; border-color: transparent; color: var(--danger); }
.btn.danger-ghost:hover { background: var(--danger-tint); border-color: oklch(0.499 0.18 25 / .25); }
.btn.on-dark { background: var(--spot-strong); border-color: var(--spot-strong); color: oklch(0.13 0.01 265); }
.btn.on-dark:hover { background: var(--spot); border-color: var(--spot); }

.badge {
  display: inline-flex; align-items: center; gap: 5px;
  height: 21px; padding: 0 8px; border-radius: var(--r-xs);
  font-size: 12px; font-weight: 500; letter-spacing: 0.01em; white-space: nowrap;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
}
.badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.success { color: var(--success); background: var(--success-tint); border-color: oklch(0.499 0.13 145 / .2); }
.badge.warning { color: var(--warning); background: var(--warning-tint); border-color: oklch(0.499 0.12 75 / .2); }
.badge.danger  { color: var(--danger);  background: var(--danger-tint);  border-color: oklch(0.499 0.18 25 / .2); }
.badge.live    { color: var(--live);    background: var(--live-tint);    border-color: oklch(0.499 0.17 145 / .2); }

.card { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-lg); }
.card.pad { padding: 20px; }

/* 台账表格 */
.ledger-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.ledger-table th {
  text-align: left; font-weight: 400; font-family: var(--font-mono); font-size: 12px;
  letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2);
  padding: 9px 14px; border-bottom: 1px solid var(--rule); white-space: nowrap;
}
.ledger-table td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.ledger-table tbody tr:last-child td { border-bottom: 0; }
.ledger-table tbody tr { transition: background .12s var(--ease-out); }
.ledger-table tbody tr:hover { background: var(--surface); }
.ledger-table .r { text-align: right; }
.ledger-table th.r { text-align: right; }
.ledger-table td.num, .ledger-table td .num { font-size: 13px; }

/* 终端面板（深色载体 — spot 唯一舞台） */
.terminal {
  background: var(--dark-bg); color: var(--dark-ink);
  border-radius: var(--r-lg); overflow: hidden;
  box-shadow: var(--shadow-lg);
}
.terminal .bar {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px; border-bottom: 1px solid var(--dark-line);
  font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.06em;
  color: var(--dark-muted); text-transform: uppercase;
}
.terminal .bar .sig { display: flex; gap: 6px; }
.terminal .bar .sig i { width: 9px; height: 9px; border-radius: 50%; background: var(--dark-line); }
.terminal pre {
  margin: 0; padding: 18px 20px; overflow-x: auto;
  font-family: var(--font-mono); font-size: 14px; line-height: 1.75;
  font-variant-numeric: tabular-nums; color: var(--dark-ink);
}
.terminal pre .cm { color: var(--dark-muted); }       /* 注释/弱化 */
.terminal pre .sp { color: var(--spot); }             /* 品红 — 关键值 */
.terminal pre .ss { color: var(--spot-strong); font-weight: 700; } /* 满彩点睛 每屏一次 */
.terminal pre .ok { color: oklch(0.78 0.12 145); }

/* 筛选 chips */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 29px; padding: 0 12px;
  border-radius: var(--r-pill); border: 1px solid var(--line);
  font-size: 13px; color: var(--ink-2); background: var(--bg);
  transition: color .15s var(--ease-out), background-color .15s var(--ease-out), border-color .15s var(--ease-out);
}
.chip:hover { border-color: var(--line-strong); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--accent-ink); border-color: var(--ink); }
.chip .n { font-family: var(--font-mono); font-size: 12px; opacity: .8; }

/* 搜索框 */
.search {
  display: flex; align-items: center; gap: 8px; height: 36px;
  padding: 0 12px; border: 1px solid var(--line); border-radius: var(--r-sm);
  background: var(--bg); transition: border-color .15s var(--ease-out);
  min-width: 220px;
}
.search:focus-within { border-color: var(--accent); }
.search input { border: 0; outline: none; background: transparent; width: 100%; font-size: 14px; color: var(--ink); }
.search input::placeholder { color: var(--ink-2); }
.search .count { font-family: var(--font-mono); font-size: 11px; color: var(--ink-2); }

/* 输入 */
.field { display: block; }
.field > .lb { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
.field > .lb .opt { color: var(--ink-2); font-weight: 400; font-size: 12px; }
.input {
  width: 100%; height: 36px; padding: 0 12px;
  border: 1px solid var(--line-strong); border-radius: var(--r-sm);
  background: var(--bg); font-size: 14px; color: var(--ink);
  transition: border-color .15s var(--ease-out);
}
.input:focus { outline: none; border-color: var(--accent); }
.input.mono { font-family: var(--font-mono); font-size: 13px; }
.hint { font-size: 12px; color: var(--ink-2); margin-top: 5px; }


#toasts { position: fixed; bottom: 24px; right: 24px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
.toast {
  display: flex; align-items: center; gap: 9px;
  background: var(--ink); color: var(--accent-ink);
  border-radius: var(--r); padding: 10px 14px; font-size: 13px;
  box-shadow: var(--shadow-lg);
  animation: toast-in .28s var(--ease-spring);
}
.toast svg { flex-shrink: 0; }
@keyframes toast-in { from { opacity: 0; transform: translateY(10px); } }

/* KPI 行（概览） */
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; background: var(--bg); }
.kpi { padding: 18px 20px; border-left: 1px solid var(--line); }
.kpi:first-child { border-left: 0; }
.kpi .lb { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); font-family: var(--font-mono); }
.kpi .v { margin-top: 8px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 30px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
.kpi .s { margin-top: 6px; font-size: 12px; color: var(--ink-2); }

/* 区块标题（硬规则线骨架） */
.sect { margin-top: 40px; }
.sect > .secthead {
  display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
  border-bottom: 1px solid var(--rule); padding-bottom: 10px; margin-bottom: 0;
}
.sect > .secthead h2 { font-size: 16px; font-weight: 600; letter-spacing: 0.01em; }
.sect > .secthead .more { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); display: inline-block; padding: 6px 2px; margin: -6px -2px; }
.sect > .secthead .more:hover { color: var(--ink); }

/* 分页 */
.pager { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; font-size: 13px; color: var(--ink-2); }
.pager .pages { display: flex; gap: 4px; }
.pager button.pg {
  min-width: 30px; height: 30px; padding: 0 8px; border-radius: var(--r-sm);
  border: 1px solid transparent; font-family: var(--font-mono); font-size: 13px; color: var(--ink-2);
}
.pager button.pg:hover:not(:disabled) { border-color: var(--line-strong); color: var(--ink); }
.pager button.pg[aria-current="true"] { background: var(--ink); color: var(--accent-ink); }
.pager button.pg:disabled { opacity: .35; cursor: default; }

/* 屏幕切换 */




/* 演示数据标签 */
.demo-tag {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.06em;
  color: var(--ink-2); border: 1px dashed var(--line-strong);
  border-radius: var(--r-xs); padding: 2px 7px; text-transform: uppercase;
}
/* ── 首页 hero ────────────────────────────────────────────── */
.hero { display: grid; grid-template-columns: minmax(0, 10fr) minmax(0, 9fr); gap: 48px; align-items: center; padding-top: 56px; }
.hero .eyebrow-row { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
.hero .eyebrow-row .sep { width: 28px; height: 1px; background: var(--rule); }
.hero .desc { margin-top: 16px; font-size: 15.5px; line-height: 1.75; color: var(--ink-2); max-width: 46ch; }
.hero .cta { display: flex; align-items: center; gap: 16px; margin-top: 28px; }
.hero .cta .ghostlink { font-size: 14px; color: var(--ink); border-bottom: 1px solid var(--line-strong); padding-bottom: 1px; }
.hero .cta .ghostlink:hover { border-color: var(--ink); }
.hero .facts { display: flex; gap: 0; margin-top: 34px; border-top: 1px solid var(--rule); }
.hero .facts .f { padding: 14px 26px 0 0; margin-right: 26px; border-right: 1px solid var(--line); }
.hero .facts .f:last-child { border-right: 0; margin-right: 0; }
.hero .facts .v { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
.hero .facts .k { font-size: 12px; color: var(--ink-2); margin-top: 3px; }
.hero .term { min-width: 0; }
.hero .term .foot {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px; border-top: 1px solid var(--dark-line);
  font-family: var(--font-mono); font-size: 12px; color: var(--dark-muted);
}
.hero .term .foot .cost b { color: var(--spot); font-weight: 600; }

/* 首页：步骤与路由图 */
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.steps .st { padding: 22px; border-left: 1px solid var(--line); background: var(--bg); }
.steps .st:first-child { border-left: 0; }
.steps .st .no { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); }
.steps .st .tt { margin-top: 8px; font-size: 15px; font-weight: 600; }
.steps .st .dd { margin-top: 6px; font-size: 13px; line-height: 1.65; color: var(--ink-2); }

.routemap { display: flex; align-items: stretch; gap: 0; border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.routemap .node { flex: 1; padding: 20px 22px; }
.routemap .node .nk { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
.routemap .node .nv { margin-top: 8px; font-size: 14px; font-weight: 500; }
.routemap .node .nd { margin-top: 4px; font-size: 12.5px; color: var(--ink-2); }
.routemap .node.dark .nd { color: oklch(0.75 0.005 265); }
.routemap .node.dark { background: var(--dark-bg); color: var(--dark-ink); flex: 0.9; }
.routemap .node.dark .nk { color: var(--dark-muted); }
.routemap .arrow { display: flex; align-items: center; padding: 0 10px; color: var(--ink-3); border-left: 1px solid var(--line); border-right: 1px solid var(--line); }

/* 文档两栏 */
.docs-layout { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 48px; align-items: start; }
.docs-layout > * { min-width: 0; }
.docs-toc { position: sticky; top: 92px; }
.docs-toc a {
  display: block; padding: 6px 0 6px 14px; border-left: 2px solid var(--line);
  font-size: 13px; color: var(--ink-2); transition: color .15s, border-color .15s;
}
.docs-toc a:hover { color: var(--ink); }
.docs-toc a.active { color: var(--ink); border-left-color: var(--rule); font-weight: 500; }
.docs-body section { margin-top: 40px; }
.docs-body section:first-child { margin-top: 0; }
.docs-body h2 { font-size: 17px; font-weight: 600; display: flex; gap: 10px; align-items: baseline; }
.docs-body h2 .n { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); }
.docs-body p { margin-top: 10px; font-size: 14px; line-height: 1.8; color: var(--ink-2); max-width: 68ch; }
.docs-body .margin-note {
  margin-top: 14px; padding: 12px 16px; background: var(--surface);
  border-left: 2px solid var(--rule); font-size: 13px; line-height: 1.7; color: var(--ink-2);
  border-radius: 0 var(--r-sm) var(--r-sm) 0; max-width: 68ch;
}

/* 概览 sparkline */
.spark-wrap { display: flex; gap: 20px; align-items: stretch; }
.spark-legend { display: flex; gap: 18px; margin-top: 10px; font-size: 12px; color: var(--ink-2); }
#spark-xlabels { display: flex; justify-content: space-between; margin-top: 8px; padding: 0 1.6%; font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); }
#spark-xlabels span:first-child { text-align: left; }
#spark-xlabels span:last-child { text-align: right; }
.spark-legend i { display: inline-block; width: 10px; height: 2px; background: var(--ink); margin-right: 6px; vertical-align: middle; }

/* key 行 */
.keyrow { display: flex; align-items: center; gap: 12px 20px; padding: 16px 20px; border-bottom: 1px solid var(--line); transition: opacity .2s; flex-wrap: wrap; row-gap: 14px; }
.keyrow:last-child { border-bottom: 0; }
.keyrow.revoked { opacity: .55; }
.keyrow .id { flex: 1 1 240px; min-width: 0; }
.keyrow .id .nm { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.keyrow .id .prefix { margin-top: 5px; }
.keyrow .stats { display: flex; gap: 14px 28px; text-align: right; flex-wrap: wrap; margin-left: auto; }
.keyrow .stats .cell .v { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 13.5px; font-weight: 500; }
.keyrow .stats .cell .k { font-size: 12px; color: var(--ink-2); margin-top: 2px; }

/* 充值 */
.balance-strip { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; border: 1px solid var(--line); border-radius: var(--r-lg); padding: 24px 26px; }
.balance-strip .big { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 40px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.05; margin-top: 10px; }
.packs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.pack { position: relative; text-align: left; border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px; background: var(--bg); transition: border-color .15s var(--ease-out), box-shadow .15s var(--ease-out); }
.pack:hover { border-color: var(--line-strong); }
.pack[aria-pressed="true"] { border-color: var(--ink); box-shadow: var(--shadow-md); }
.pack .amt { font-family: var(--font-mono); font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
.pack .per { font-size: 12.5px; color: var(--ink-2); margin-top: 6px; line-height: 1.6; }
.pack .tick { position: absolute; top: 14px; right: 14px; opacity: 0; transition: opacity .15s; }
.pack[aria-pressed="true"] .tick { opacity: 1; }
.reqcode-card { border: 1px solid var(--rule); border-radius: var(--r-lg); padding: 22px 24px; background: var(--bg); }
.reqcode-card .code {
  font-family: var(--font-mono); font-size: 24px; letter-spacing: 0.14em; font-weight: 600;
  margin-top: 10px; user-select: all;
}
.reqcode-card .cd { font-variant-numeric: tabular-nums; }

/* 模型详情格 */
.statgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.statgrid .cell { background: var(--bg); padding: 16px 18px; }
.statgrid .cell .k { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.05em; color: var(--ink-2); text-transform: uppercase; }
.statgrid .cell .v { margin-top: 7px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 500; }

/* 响应式 */
@media (max-width: 1180px) {
  .sidebar { width: 72px; }
  .sidebar .brand .name, .sidebar .navgroup > .eyebrow, .sidebar .navitem .t, .sidebar .account .who { display: none; }
  .sidebar .brand { justify-content: center; padding: 0; }
  .sidebar nav { padding: 14px 0; }
  .navitem { justify-content: center; padding: 0; width: 36px; height: 36px; margin: 3px auto; }
  .sidebar .account { flex-direction: column; gap: 8px; padding: 12px 8px; }
  .hero { grid-template-columns: 1fr; gap: 36px; padding-top: 36px; }
  .statgrid { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 900px) {
  .content, .content.wide { width: min(100% - 48px, 1120px); }
  .kpis { grid-template-columns: 1fr; }
  .kpi { border-left: 0; border-top: 1px solid var(--line); }
  .kpi:first-child { border-top: 0; }
  .steps, .packs { grid-template-columns: 1fr; }
  .steps .st { border-left: 0; border-top: 1px solid var(--line); }
  .steps .st:first-child { border-top: 0; }
  .docs-layout { grid-template-columns: 1fr; }
  .docs-toc { position: static; display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .docs-toc a { border-left: 0; padding: 2px 0; }
  .docs-toc a.active { border-left: 0; }
  .routemap { flex-direction: column; }
  .routemap .arrow { transform: rotate(90deg); border: 0; border-top: 1px solid var(--line); justify-content: center; }
  .topnav { gap: 12px; padding: 0 24px; overflow-x: auto; }
  .keyrow { flex-wrap: wrap; }
  .statgrid { grid-template-columns: repeat(2, 1fr); }
}
/* SEGMENT-CSS */

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

<div class="canvas-viewport" id="viewport">
  <div class="canvas-world" id="world"></div>
</div>

<div class="zoom-controls">
  <button class="zoom-btn" id="zoomOut" aria-label="">&#8722;</button>
  <div class="zoom-label" id="zoomLabel">100%</div>
  <button class="zoom-btn" id="zoomIn" aria-label="">+</button>
  <button class="zoom-btn" id="zoomReset" title="" aria-label="">&#8962;</button>
</div>

<div class="coord-indicator" id="coordIndicator">0, 0</div>

<div class="kbd-hint" id="kbdHint"></div>

<script>
(() => {
  // ═══════════════════════════════════════════════════════════
  // LOCALIZE: instantiating agent MUST translate every value in
  // UI_STRINGS to the user's conversation language. Machine fields
  // (id/class/data-*) remain English.
  // ═══════════════════════════════════════════════════════════
  const UI_STRINGS = {
    projectDescription: 'Infinite canvas design delivery template.\nSupports free layout of titles, text, tags, cards, color swatches, type samples, design pages, and notes.',
    tags: ['Infinite Canvas', 'Design Delivery', 'Three-Layer Architecture'],
    contextCards: {
      coreFeatures: { title: 'Core Features', items: ['Pan & zoom canvas', 'Drag elements freely', 'Undo layout changes', 'Trackpad gesture support'] },
      techHighlights: { title: 'Technical Highlights', items: ['Single-file HTML delivery', 'No external dependencies', 'Open directly in browser', 'Pointer Events touch compatibility'] },
      deliveryStandards: { title: 'Delivery Standards', items: ['Row 1 answers three core questions', 'Row 2 shows color & type system', 'Row 3 pages arranged by flow'] },
    },
    notes: {
      designPhilosophy: { tag: 'Design Philosophy', body: 'Pursue a design-board feel, not a table. Elements scatter freely; important things are bigger and more prominent.' },
      remark: { tag: 'Remark', body: 'This is the template demo scene. When used, the agent fills in project content.' },
    },
    typeSamples: {
      heading: 'Heading',
      subheading: 'Subheading',
      bodyText: 'Body text. Design is the process of turning intent into perceivable form.',
      caption: 'Caption / supplementary text',
    },
    pages: {
      home: { label: 'Home', heading: 'Welcome to the Infinite Canvas', cta: 'Start Exploring' },
      discover: { label: 'Discover', todayPick: 'Today\'s Picks' },
      cards: {
        designSystemIntro: { title: 'Design System Basics', desc: 'Build a complete design language from scratch' },
        colorTheory: { title: 'Color Theory', desc: 'Understanding oklch and harmonious palettes' },
        typographyRhythm: { title: 'Typography Rhythm', desc: 'Line height, letter spacing, and breathing room' },
      },
      profile: { label: 'Profile', name: 'Designer', role: 'Product Design \u00b7 3 Projects', items: ['My Projects', 'Design Specs', 'Settings'] },
    },
    docTitle: 'Relay 中转驿 · 无限画布',
    zoom: { zoomIn: '放大', zoomOut: '缩小', reset: '重置视图' },
    kbdHints: [['滚动', '平移'], ['\u2318滚动', '缩放'], ['\u2318Z', '撤销']],
    sections: { context: '01 PROJECT CONTEXT', designSystem: '02 DESIGN SYSTEM', deliverables: '03 DESIGN DELIVERABLES' },
    demoTitle: 'Canvas Template',
    designSystemCards: {
      colorTitle: 'Color Palette',
      typographyTitle: 'Typography',
      componentsTitle: 'Components',
      swatchNames: ['Accent', 'Surface', 'Raised', 'Text', 'Muted', 'Border'],
      typeMeta: { h1: 'H1', h2: 'H2', body: 'Body', caption: 'Caption' },
      componentSamples: { primary: 'Primary Button', secondary: 'Secondary', inputPlaceholder: 'Input placeholder\u2026' },
    },
    hello: 'Hello',
  };

  // Chrome strings live in UI_STRINGS too — applied here so the static HTML
  // above carries no visible copy at all (machine-checkable invariant).
  document.title = UI_STRINGS.docTitle;
  document.getElementById('zoomIn').setAttribute('aria-label', UI_STRINGS.zoom.zoomIn);
  document.getElementById('zoomOut').setAttribute('aria-label', UI_STRINGS.zoom.zoomOut);
  document.getElementById('zoomReset').setAttribute('aria-label', UI_STRINGS.zoom.reset);
  document.getElementById('kbdHint').innerHTML = UI_STRINGS.kbdHints
    .map(([keys, action]) => `<span><kbd>${keys}</kbd> ${action}</span>`)
    .join('');

  const viewport = document.getElementById('viewport');
  const world = document.getElementById('world');
  const zoomLabel = document.getElementById('zoomLabel');
  const coordIndicator = document.getElementById('coordIndicator');

  /* ===== canvas state ===== */
  let panX = 0, panY = 0, zoom = 1;
  const MIN_ZOOM = 0.05, MAX_ZOOM = 8;

  function updateTransform() {
    world.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`;
    zoomLabel.textContent = Math.round(zoom * 100) + '%';
    updateGrid();
  }

  /* ===== dot grid ===== */
  function updateGrid() {
    const g = 40 * zoom;
    const ox = panX % g, oy = panY % g;
    viewport.style.backgroundImage = `radial-gradient(circle, var(--grid-color) 0.8px, transparent 0.8px)`;
    viewport.style.backgroundSize = `${g}px ${g}px`;
    viewport.style.backgroundPosition = `${ox}px ${oy}px`;
  }

  /* ===== panning ===== */
  let isPanning = false, panSX, panSY;

  viewport.addEventListener('pointerdown', (e) => {
    if (e.target === viewport || e.target === world) {
      isPanning = true;
      panSX = e.clientX - panX;
      panSY = e.clientY - panY;
      viewport.classList.add('panning');
      viewport.setPointerCapture(e.pointerId);
      e.preventDefault();
    }
  });
  viewport.addEventListener('pointermove', (e) => {
    if (!isPanning) return;
    panX = e.clientX - panSX;
    panY = e.clientY - panSY;
    updateTransform();
  });
  viewport.addEventListener('pointerup', () => {
    isPanning = false;
    viewport.classList.remove('panning');
  });

  /* ===== wheel: trackpad scroll = pan, pinch/ctrl+scroll = zoom ===== */
  viewport.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = viewport.getBoundingClientRect();

    if (e.ctrlKey || e.metaKey) {
      const mx = e.clientX - rect.left, my = e.clientY - rect.top;
      const wx = (mx - panX) / zoom, wy = (my - panY) / zoom;
      const factor = e.deltaY > 0 ? 0.95 : 1.05;
      zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * factor));
      panX = mx - wx * zoom;
      panY = my - wy * zoom;
    } else {
      const hasX = Math.abs(e.deltaX) > 0.5;
      if (hasX || Math.abs(e.deltaX) > Math.abs(e.deltaY) * 0.3) {
        panX -= e.deltaX;
        panY -= e.deltaY;
      } else {
        const mx = e.clientX - rect.left, my = e.clientY - rect.top;
        const wx = (mx - panX) / zoom, wy = (my - panY) / zoom;
        const factor = e.deltaY > 0 ? 0.95 : 1.05;
        zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * factor));
        panX = mx - wx * zoom;
        panY = my - wy * zoom;
      }
    }
    updateTransform();
  }, { passive: false });

  /* ===== zoom buttons ===== */
  function zoomAt(factor) {
    const r = viewport.getBoundingClientRect();
    const cx = r.width / 2, cy = r.height / 2;
    const wx = (cx - panX) / zoom, wy = (cy - panY) / zoom;
    zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * factor));
    panX = cx - wx * zoom;
    panY = cy - wy * zoom;
    updateTransform();
  }
  document.getElementById('zoomIn').onclick = () => zoomAt(1.25);
  document.getElementById('zoomOut').onclick = () => zoomAt(0.8);
  document.getElementById('zoomReset').onclick = () => { zoom = 1; panX = 0; panY = 0; updateTransform(); };
  document.getElementById('zoomReset').title = UI_STRINGS.zoom.reset;

  /* ===== coord indicator ===== */
  viewport.addEventListener('pointermove', (e) => {
    if (isPanning) return;
    const r = viewport.getBoundingClientRect();
    coordIndicator.textContent = `${Math.round((e.clientX - r.left - panX) / zoom)}, ${Math.round((e.clientY - r.top - panY) / zoom)}`;
  });

  /* ===== touch gestures ===== */
  let lastPinchDist = null, lastPinchCenter = null;

  viewport.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      const t0 = e.touches[0], t1 = e.touches[1];
      lastPinchDist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
      lastPinchCenter = { x: (t0.clientX + t1.clientX) / 2, y: (t0.clientY + t1.clientY) / 2 };
      e.preventDefault();
    }
  }, { passive: false });

  viewport.addEventListener('touchmove', (e) => {
    if (e.touches.length !== 2) return;
    e.preventDefault();
    const t0 = e.touches[0], t1 = e.touches[1];
    const dist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
    const center = { x: (t0.clientX + t1.clientX) / 2, y: (t0.clientY + t1.clientY) / 2 };
    if (lastPinchDist > 0) {
      const r = viewport.getBoundingClientRect();
      const mx = center.x - r.left, my = center.y - r.top;
      const wx = (mx - panX) / zoom, wy = (my - panY) / zoom;
      zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * Math.pow(dist / lastPinchDist, 0.6)));
      panX = mx - wx * zoom;
      panY = my - wy * zoom;
    }
    if (lastPinchCenter) {
      panX += center.x - lastPinchCenter.x;
      panY += center.y - lastPinchCenter.y;
    }
    lastPinchDist = dist;
    lastPinchCenter = center;
    updateTransform();
  }, { passive: false });

  viewport.addEventListener('touchend', (e) => {
    if (e.touches.length < 2) { lastPinchDist = null; lastPinchCenter = null; }
  });

  /* ===== undo ===== */
  const undoStack = [];
  function saveUndo() {
    const s = [];
    world.querySelectorAll('.canvas-el').forEach(el => {
      s.push({ id: el.id, left: el.style.left, top: el.style.top });
    });
    undoStack.push({ panX, panY, zoom, assets: s });
    if (undoStack.length > 60) undoStack.shift();
  }
  function undo() {
    if (!undoStack.length) return;
    const st = undoStack.pop();
    panX = st.panX; panY = st.panY; zoom = st.zoom;
    st.assets.forEach(a => {
      const el = document.getElementById(a.id);
      if (el) { el.style.left = a.left; el.style.top = a.top; }
    });
    updateTransform();
  }
  document.addEventListener('keydown', (e) => {
    if (e.target instanceof Element && e.target.closest('input, textarea, select, [contenteditable]')) return;
    if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); }
  });

  /* ===== draggable ===== */
  function makeDraggable(el) {
    let dragging = false, sx, sy, ox, oy;
    el.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || (e.target instanceof Element && e.target.closest('button, a, input, textarea, select, [contenteditable]'))) return;
      dragging = true;
      el.classList.add('dragging');
      saveUndo();
      sx = e.clientX; sy = e.clientY;
      ox = parseFloat(el.style.left); oy = parseFloat(el.style.top);
      el.setPointerCapture(e.pointerId);
      e.stopPropagation();
    });
    el.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      el.style.left = (ox + (e.clientX - sx) / zoom) + 'px';
      el.style.top = (oy + (e.clientY - sy) / zoom) + 'px';
    });
    el.addEventListener('pointerup', () => {
      if (dragging) { dragging = false; el.classList.remove('dragging'); }
    });
  }

  /* ===== unique id ===== */
  let _id = 0;
  function uid(prefix) { return (prefix || 'el') + '-' + (++_id); }

  /* ===== API: addSection ===== */
  function addSection(rowY, label) {
    const parts = label.split(' ');
    const num = parts[0] || '';
    const rest = parts.slice(1).join(' ');
    const el = document.createElement('div');
    el.className = 'section-header';
    el.style.left = '60px';
    el.style.top = rowY + 'px';
    el.innerHTML = `<span class="section-line"></span><span class="section-num">${num}</span><span class="section-label">${rest}</span>`;
    world.appendChild(el);
    return rowY;
  }

  /* ===== API: addTitle ===== */
  function addTitle(x, y, text, options = {}) {
    const el = document.createElement('div');
    el.className = 'canvas-title';
    el.id = uid('title');
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.fontSize = (options.fontSize || 48) + 'px';
    if (options.fontWeight) el.style.fontWeight = options.fontWeight;
    if (options.color) el.style.color = options.color;
    if (options.maxWidth) el.style.maxWidth = options.maxWidth + 'px';
    el.textContent = text;
    world.appendChild(el);
    return el;
  }

  /* ===== API: addText ===== */
  function addText(x, y, text, options = {}) {
    const el = document.createElement('div');
    el.className = 'canvas-text canvas-el';
    el.id = uid('text');
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.fontSize = (options.fontSize || 14) + 'px';
    if (options.color) el.style.color = options.color;
    if (options.maxWidth) el.style.maxWidth = options.maxWidth + 'px';
    el.textContent = text;
    world.appendChild(el);
    makeDraggable(el);
    return el;
  }

  /* ===== API: addTag ===== */
  function addTag(x, y, label, options = {}) {
    const el = document.createElement('div');
    el.className = 'canvas-el';
    el.id = uid('tag');
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    const dotColor = options.color || 'var(--accent)';
    el.innerHTML = `<div class="canvas-tag"><span class="tag-dot" style="background:${dotColor}"></span>${label}</div>`;
    world.appendChild(el);
    makeDraggable(el);
    return el;
  }

  /* ===== API: addContextCard ===== */
  function addContextCard(x, y, w, h, title, content) {
    const el = document.createElement('div');
    el.className = 'canvas-el';
    el.id = uid('ctx');
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.width = w + 'px';
    if (h) el.style.height = h + 'px';
    el.innerHTML = `<div class="context-card" style="width:100%;${h ? 'height:100%' : ''}">
      <div class="card-head"><div class="head-indicator"></div><h3>${title}</h3></div>
      <div class="card-content">${content}</div>
    </div>`;
    world.appendChild(el);
    makeDraggable(el);
    return el;
  }

  /* ===== API: addDesignSystemCard ===== */
  function addDesignSystemCard(x, y, w, h, type, data) {
    const el = document.createElement('div');
    el.className = 'canvas-el';
    el.id = uid('ds');
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.width = w + 'px';
    if (h) el.style.height = h + 'px';

    let body = '';
    if (type === 'color' && Array.isArray(data.colors)) {
      body = `<div class="color-grid">${data.colors.map(c =>
        `<div class="color-chip" style="background:${c.hex}"><span class="chip-label">${c.name || c.hex}</span></div>`
      ).join('')}</div>`;
    } else if (type === 'typography' && Array.isArray(data.samples)) {
      body = `<div class="type-stack">${data.samples.map(s =>
        `<div class="type-row"><span class="type-label">${s.label}</span><span class="type-sample" style="font-size:${s.size}px;font-weight:${s.weight || 400}">${s.text || 'Aa'}</span></div>`
      ).join('')}</div>`;
    } else if (typeof data.html === 'string') {
      body = data.html;
    }

    el.innerHTML = `<div class="ds-card" style="width:100%;${h ? 'height:100%' : ''}">
      <div class="ds-head">${data.title || type}</div>
      <div class="ds-body">${body}</div>
    </div>`;
    world.appendChild(el);
    makeDraggable(el);
    return el;
  }

  /* ===== API: addColorSwatch ===== */
  function addColorSwatch(x, y, colors) {
    const el = document.createElement('div');
    el.className = 'canvas-el';
    el.id = uid('swatch');
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.innerHTML = `<div class="color-swatch-group">${colors.map(c =>
      `<div class="swatch-item">
        <div class="swatch-circle" style="background:${c.hex}"></div>
        <div class="swatch-name">${c.name || ''}</div>
        <div class="swatch-hex">${c.hex}</div>
      </div>`
    ).join('')}</div>`;
    world.appendChild(el);
    makeDraggable(el);
    return el;
  }

  /* ===== API: addTypeSample ===== */
  function addTypeSample(x, y, samples) {
    const el = document.createElement('div');
    el.className = 'canvas-el';
    el.id = uid('typesample');
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.innerHTML = `<div class="type-sample-group">${samples.map(s =>
      `<div class="type-sample-row">
        <span class="type-sample-meta">${s.label}<br>${s.size}px</span>
        <span class="type-sample-text" style="font-size:${s.size}px;font-weight:${s.weight || 400};${s.font ? 'font-family:' + s.font : ''}">${s.text || 'The quick brown fox'}</span>
      </div>`
    ).join('')}</div>`;
    world.appendChild(el);
    makeDraggable(el);
    return el;
  }

  /* ===== API: addPage ===== */
  let _pageNum = 0;
  function addPage(x, y, w, h, label, htmlContent) {
    _pageNum++;
    const el = document.createElement('div');
    el.className = 'canvas-el';
    el.id = uid('page');
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.width = w + 'px';
    el.style.height = (h + 40) + 'px';
    el.innerHTML = `<div class="design-page" style="width:${w}px;height:${h}px;">
      <div class="page-content">${htmlContent}</div>
    </div>
    <div class="page-label"><span class="label-num">${String(_pageNum).padStart(2,'0')}</span>${label}</div>`;
    world.appendChild(el);
    makeDraggable(el);
    return el;
  }

  /* ===== API: addNote ===== */
  function addNote(x, y, tag, text) {
    const el = document.createElement('div');
    el.className = 'canvas-el';
    el.id = uid('note');
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.innerHTML = `<div class="canvas-note">
      <div class="note-tag">${tag}</div>
      <div class="note-body">${text}</div>
    </div>`;
    world.appendChild(el);
    makeDraggable(el);
    return el;
  }

  /* ===== API: addDiagram ===== */
  function addDiagram(x, y, w, h, htmlContent) {
    const el = document.createElement('div');
    el.className = 'canvas-el';
    el.id = uid('diagram');
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.width = w + 'px';
    el.style.height = h + 'px';
    el.innerHTML = `<div class="canvas-diagram" style="width:100%;height:100%;">
      <div class="diagram-content">${htmlContent}</div>
    </div>`;
    world.appendChild(el);
    makeDraggable(el);
    return el;
  }

  /* ===== Layout helpers (overlap prevention) ===== */
  function below(el, gap) { if (gap === undefined) gap = 20; return parseFloat(el.style.top) + el.offsetHeight + gap; }
  function rightOf(el, gap) { if (gap === undefined) gap = 20; return parseFloat(el.style.left) + el.offsetWidth + gap; }
  function maxY(els, gap) { if (gap === undefined) gap = 20; return Math.max(...els.map(e => parseFloat(e.style.top) + e.offsetHeight)) + gap; }
  function maxX(els, gap) { if (gap === undefined) gap = 20; return Math.max(...els.map(e => parseFloat(e.style.left) + e.offsetWidth)) + gap; }

  /* ===== expose API ===== */
  window.canvas = { addSection, addTitle, addText, addTag, addContextCard, addDesignSystemCard, addColorSwatch, addTypeSample, addPage, addNote, addDiagram, below, rightOf, maxY, maxX };

  /* ===== demo scene ===== */
  /* Layout rules:
     - Vertical positioning uses below(el, gap) based on actual rendered height of the element above, no hardcoded Y
     - Horizontal positioning uses rightOf(el, gap) or fixed X (fixed values are fine when element widths are known)
     - Cross-row alignment uses maxY([all elements in that row], 80) to get the next row's starting Y
     - Always save the return value of each add* call to a variable for later element references
  */
  function initScene() {

    addSection(40, '01 PROJECT CONTEXT');
    const r1Title = addTitle(100, 96, 'Relay 中转驿 · 用户侧重设计', { fontSize: 52, fontWeight: 700 });
    const r1Desc = addText(100, below(r1Title, 14), '自建 LLM API 中转站的用户侧九屏重设计：公开区（首页/模型广场/模型详情/文档）做产品叙事，控制台五屏做高密度工程台账。视觉基因沿用 @zmzai/theme 0.9 —— 纯白底、墨黑结构、品红点睛只在深色载体登场。', { fontSize: 15, maxWidth: 470 });
    const tagsY = below(r1Desc, 18);
    const t1 = addTag(100, tagsY, '9 屏用户侧');
    const t2 = addTag(rightOf(t1, 8), tagsY, '工程台账方向');
    const t3 = addTag(rightOf(t2, 8), tagsY, '@zmzai/theme 0.9');
    const t4 = addTag(rightOf(t3, 8), tagsY, '桌面优先 · 1440');
    const cardsY = below(t1, 26);
    const c1 = addContextCard(100, cardsY, 300, null, '产品是什么', '<ul><li>OpenAI 兼容统一入口，换 baseURL 即用</li><li>按模型自动路由与故障切换</li><li>价格公开，按 token 实时计费</li><li>zrk_ Key + 余额账本 + 充值流程</li></ul>');
    const c2 = addContextCard(420, cardsY, 300, null, '这次改了什么', '<ul><li>公开区侧栏改顶栏，首页做产品叙事与路由图</li><li>控制台改台账式高密度表格</li><li>墨底终端成为品红点睛的合法舞台</li><li>全站数字等宽右对齐 tabular-nums</li></ul>');
    const c3 = addContextCard(740, cardsY, 300, null, '保留什么', '<ul><li>真实模型目录与价格（glm-5.3 / flash）</li><li>zrk_ Key 一次性展示与吊销语义</li><li>¥8/¥40/¥160 额度包与申请码流程</li><li>品牌云朵标与 Margin 命名</li></ul>');
